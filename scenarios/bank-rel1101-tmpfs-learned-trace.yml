# SHIPPED-STACK CONTROL ARM (2026-09-27). The tmpfs learned bank shape of tr1 / qp2 (tmpfs, heap pin, learned routing,
# 128 workers, 50/50) on the stack that shipped today: CamusDB HEAD with Kahuna.Core 1.10.1 (lock-free TerminalOutcomeWindow,
# materialize-on-resolve present but off) and Kommander 1.9.0 (round-stage histogram present but off) from nuget.org, plus the
# retryable-abort value path (camus.kv.retryable_aborts). Warm-up is 6 minutes so tools/p3c/rel1101-pair.sh can take the leader
# and follower EventPipe traces and run the schedstat sampler INSIDE the warm-up; the measured 10 minutes are the unperturbed
# control. Compare with tr1 (7,989 ops/s, 6-min warm-up) and qp2-off (8,432 ops/s, 2-min warm-up).
# ONE image (caraxes/camusdb:bankrel1101), built beforehand from ~/camusdb, shared with the -stages arm.
name: bank-rel1101-tmpfs-learned-trace
cluster:
  name: bankrel1101trace
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 9728
  data_tmpfs_mb: 6144
  gc_heap_hard_limit_mb: 2458
  kahuna:
    # ON, and stated rather than inherited: this is CamusDB's default as of `529f8611`.
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:bankrel1101"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 128
  connections: 64
  duration: 10m
  warmup: 6m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
