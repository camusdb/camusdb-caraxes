# pr1 (2026-11-14): read-only point reads over 5,000,000 rows x 256-byte payload in one table (kind accounts), 100% reads: each operation is one read-only autocommit SELECT of the four columns by primary key, the key drawn uniformly from the whole table. No writes after the seed, no faults. Image k1171 (Kahuna.Core 1.17.1, SolariumDb.Kahuna 0.2.1). Arm: Solarium store and WAL on the host NVMe, 4 GiB nodes. Row-id cache of 6,000,000 entries and 750,000 resident entries per key-value actor. Kept as a record of a failure: two nodes ran out of managed heap ten minutes into the seed, so this body does not fit 4 GiB nodes.
name: pr1-read-nvme-solarium-tuned
cluster:
  name: pr1tuned
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: serializable
  diagnostics: true
  memory_limit_mb: 4096
  kahuna:
    storage: solarium
    wal_storage: solarium
    one_phase_apply_time_validation: true
    durable_materialize_on_resolve: true
    max_entries_per_actor: 750000
    max_bytes_per_actor: 805306368
    rocksdb_shared_memory_budget_mb: 768
    rocksdb_shared_memtable_budget_mb: 256
  env:
    MALLOC_ARENA_MAX: "2"
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:k1171"
  camusdb:
    point_read_row_id_cache_enabled: true
    point_read_row_id_cache_max_entries: 6000000
    optimistic_intent_wait_ms: 100
    serializable_optimistic_point_locks: false
workload:
  kind: accounts
  database: caraxes
  rows: 5000000
  payload_bytes: 256
  batch: 1000
  mode: closed
  workers: 256
  connections: 64
  duration: 10m
  warmup: 8m
  drain: 30s
  read_percent: 100
  write_percent: 0
  expect_faults: false
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
