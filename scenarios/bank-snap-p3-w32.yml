# SNAPSHOT RUN — 3 partitions, 32 workers, teardown DISABLED so the store can be read.
#
# WHY. The bank claim 2x2 found that at 3 partitions the bank table sits on partition 3 (743,426
# client ops) while **partition 1 carries another 208,366 client ops with no table on it**. That was
# read as the transaction-record keyspace hashing independently of the row keyspace, which is what
# makes every single-table bank transfer a two-participant 2PC and explains most of the 3.2x that
# consolidating to one partition buys. The reading is inferred from executor counters; it has never
# been confirmed against what is actually stored.
#
# This run reproduces `bank-claim-p3-w32` byte-for-byte except `teardown: false`, so the Kahuna data
# directory survives and `tools/snapreader` can attribute those operations BY LOG TYPE PER PARTITION
# (`walrec` for txnrecord-type entries, `wal` for kv-type). If partition 1's traffic is txnrecord
# INIT/COMMIT/ABORT commands, the inference is confirmed and the 2PC-by-topology mechanism is
# established rather than assumed.
#
# WHAT FALSIFIES WHAT.
#   - p1 entries are overwhelmingly txnrecord type -> confirmed: transaction records hash away from
#     the row keyspace, and the cost is structural to any multi-partition configuration.
#   - p1 entries are kv type on non-workload keys -> something else lives there (system/catalog), and
#     the 2PC explanation for the 3.2x is wrong.
#   - p1 entries are kv type on workload rows -> hash routing is splitting the table after all, and
#     the placement report's table attribution is misleading.
#
# REMEMBER TO TEAR DOWN when the snapshot is copied: `caraxes down --spec banksnapp3w32`. The fixed
# 10.101.0.0/24 subnet means a live cluster blocks every later run.
name: bank-snap-p3-w32
cluster:
  name: banksnapp3w32
  nodes: 3
  partitions: 3
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 1536
  camusdb_repo: "~/camusdb"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 32
  connections: 16
  duration: 5m
  warmup: 2m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
  require_spread_leadership: true
teardown: false
