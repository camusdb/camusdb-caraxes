# STORAGE CORRUPTION, RF 1: one flipped bit in the largest SST of the only replica's key-value store.
#
# The kill at 1m is not a fault under test. A store holds no SST until a memtable flushes, and the restart
# writes the recovered rows to one, so the damage at 3m has a file to reach.
#
# Expected when a read reaches the damage: the statement fails with CADB0837; /v1/cluster/health answers
# ready false with storageFault set; the node never serves from the damaged store again and never rewrites
# the file. With no peer to repair from, the workload fails from then on. That failure is the correct result,
# so the scenario verdict does not decide this cell: storage-damage/storage-damage.jsonl, the node's health
# answer and an exact read of the acknowledged rows do.
name: corrupt-store-sst-bitflip-rf1
cluster:
  name: corruptsstbitfliprf1
  nodes: 1
  partitions: 1
  replication_factor: 1
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 4096
  kahuna:
    storage: rocksdb
    wal_storage: rocksdb
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:corrupt1"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 16
  connections: 16
  duration: 6m
  warmup: 20s
  drain: 60s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  cluster_facts: true
  scan_probe_interval: 5s
nemesis:
  seed: 1
  events:
    - { at: 1m, fault: kill, target: camus1, duration: 30s }
    - { at: 3m, fault: disk-corrupt, target: camus1, duration: 30s, damage: bit-flip, damage_layer: store, damage_file: sst, damage_seed: 1, damage_count: 1 }
checks:
  max_recovery_seconds: 60
  require_cluster_facts: true
teardown: false
