# ONLINE SCHEMA CHANGES UNDER LOAD, PREFLIGHT. Proves the sql fault and the schema_verify stage end to end on a small,
# fault-free run before the fault scenarios commit to them. The bank workload keeps transferring across the whole
# keyspace the whole time, so every change lands on a table under write contention:
#   20s   CREATE INDEX on balance, covering version   -> every transfer moves two entries while the index backfills
#   50s   ADD COLUMN tier DEFAULT 7                    -> the fill re-encodes rows the transfers are updating
#   80s   CREATE TABLE workload_holds                   -> a child table for the foreign key
#   90s   INSERT ... SELECT 5,000 holds (owner < 50)   -> one hold per account, amount = owner
#   110s  ADD FOREIGN KEY holds -> accounts             -> stamps the parent, so in-flight transfers must retry
#   125s  DELETE the 2,000 holds with amount < 20       -> a bulk delete under the new constraint
# After the workload: the index must hold exactly the rows the primary key holds with the same balance and version;
# every account must hold tier 7; no hold may be orphaned; 3,000 holds must remain, none below 20. The bank's own
# conservation and per-row checks are the lost-update guard for the column fill, which rewrites rows in place.
# Each statement goes to a different node, so the follower-to-leader DDL forwarding is in the path.
#
# RUNS p1/p2 (2026-10-20, FAIL, image bankpitr3; p1 without retries, p2 with sql_retries 10). The harness path works end
# to end: the ledger reconciled, the scan probe saw no short count, the column and the foreign key converged on all
# three nodes. Four CamusDB findings:
#   1. CREATE INDEX cannot complete on a table under sustained writes: refused CADB0502 eleven times over 40 s. The
#      backfill reads 500 rows per transaction as commit dependencies and does not retry a batch that loses to a
#      transfer (SchemaDdlService.BackfillIndexEntriesAsync); the statement fails and the index is dropped again.
#   2. While tier is added, transfers that never name it are refused CADB0301 "Column 'tier' cannot be null" (48 in p1,
#      150 in p2): the NOT NULL check runs on an UPDATE of an older row during WriteOnly, which the ADD COLUMN doc says
#      stores NULL for the fill to repair.
#   3. A transaction that spans the ALTER's version bump fails with CADB0099 ("already pinned schema resource at
#      version 0, not 1" / "pinned at version 0, but current version is 1"; 46 in p1, 183 in p2). Nothing was written,
#      but CADB0099 is not a retryable code, so no client retries it; the write-shape fence uses CADB0502 for the same case.
#   4. The 5,000-row INSERT ... SELECT from the busy table was refused CADB0502 on all eleven attempts (read committed
#      session); whether its source rows should be commit dependencies there is a question for CamusDB.
name: schema-preflight
cluster:
  name: schema-preflight
  nodes: 3
  partitions: 3
  replication_factor: 3
  locking: optimistic
  isolation: read_committed
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:bankpitr3"
workload:
  kind: bank
  database: caraxes
  rows: 20000
  mode: closed
  workers: 32
  connections: 16
  duration: 160s
  warmup: 15s
  drain: 10s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  scan_probe_interval: 5s
nemesis:
  seed: 1
  events:
    - { at: 20s,  fault: sql, target: camus1, duration: 5s, sql: "CREATE INDEX acct_balance ON workload_accounts (balance) INCLUDE (version)" }
    - { at: 50s,  fault: sql, target: camus2, duration: 5s, sql: "ALTER TABLE workload_accounts ADD COLUMN tier INT64 NOT NULL DEFAULT (7)" }
    - { at: 80s,  fault: sql, target: camus3, duration: 2s, sql: "CREATE TABLE workload_holds (id OID PRIMARY KEY, account_id OID NOT NULL, amount INT64 NOT NULL)" }
    - { at: 90s,  fault: sql, target: camus1, duration: 5s, sql: "INSERT INTO workload_holds (id, account_id, amount) SELECT id, id, owner FROM workload_accounts WHERE owner < 50" }
    - { at: 110s, fault: sql, target: camus2, duration: 5s, sql: "ALTER TABLE workload_holds ADD CONSTRAINT fk_holds_account FOREIGN KEY (account_id) REFERENCES workload_accounts (id)" }
    - { at: 125s, fault: sql, target: camus3, duration: 5s, sql: "DELETE FROM workload_holds WHERE amount < 20" }
schema_verify:
  stable_seconds: 10
  indexes:
    - { table: workload_accounts, name: acct_balance, columns: [balance], include: [version] }
  columns:
    - { table: workload_accounts, name: tier, value: "7" }
  foreign_keys:
    - { table: workload_holds, name: fk_holds_account, column: account_id, parent: workload_accounts }
  assertions:
    - { sql: "SELECT COUNT(*) FROM workload_holds", equals: "3000" }
    - { sql: "SELECT COUNT(*) FROM workload_holds WHERE amount < 20", equals: "0" }
checks:
  max_recovery_seconds: 60
teardown: true
