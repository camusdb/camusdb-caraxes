# Bank transfers while a range cutover is forced inside a node's kill window.
#
# Question: does an acknowledged write survive a row-space cutover that lands while one node is down, once
# that node comes back, catches up the source and the destination logs, and is elected? This is the shape
# that lost acknowledged writes on 2026-11-08 in the nightly bank-split arm: the cascade happened to cut the
# row space over from P1 to P7 at 11:52:43, inside camus1's kill window (11:52:30 to 11:52:50). camus1 then
# applied the P7 settles of two P1 transactions before their P1 prepares, re-installed the prepares as
# phantom holders, rejected 39 one-phase bundles of later transactions on those keys, fell one revision
# behind its peers, was elected leader of P7 at 11:53:07 and served the stale rows. Six rows ended one
# commit below their acknowledged count. Green nights had the same faults with the cutovers elsewhere.
#
# bank-split leaves the cutover timing to the cascade, so the shape is a coincidence there. Here the split
# fault starts the row-space move at 76 s, while camus1 is dead (70 s to 90 s): camus1 comes back to a
# destination partition created in its absence and a source whose keys moved, and must catch up both.
# Targets are explicit, so the shape does not depend on the nemesis seed. The partition of camus2 at 30 s
# is kept from bank-split; it heals at 50 s, before the kill, so camus3 answers the split ask at 76 s and
# camus2 is a healthy voter for the elections that follow the kill.
#
# Verdict: SUM(balance) conserved, every row at its acknowledged version, 0 "Stale-base veto arrived late",
# 0 "Bundled commit ... is not held by transaction" in the node logs, and the forced split committed (the
# verdict fails a run whose scheduled split did not). require_split guards the cascade as in bank-split.
name: bank-split-kill-window
cluster:
  name: bank-split-kill-window
  nodes: 3
  partitions: 4
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  key_range_sharding: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  kahuna:
    range_split_threshold: 300
    range_split_min_range_size: 100
    range_split_load_threshold: 100
    range_split_load_min_queue_depth: 8
    range_split_load_window_ms: 15000
    range_split_load_poll_interval_ms: 5000
    range_split_load_imbalance_max: 0.8
    range_split_settle_window_ms: 15000
    enable_load_reports: true
workload:
  kind: bank
  database: caraxes
  rows: 4000
  mode: closed
  workers: 32
  duration: 120s
  warmup: 15s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  scan_probe_interval: 5s
nemesis:
  seed: 59
  events:
    - { at: 30s, fault: partition, target: camus2, duration: 20s }
    - { at: 70s, fault: kill, target: camus1, duration: 20s }
    # The row-space cutover, inside the kill window. 60 s of asks would outlive the window, so the bound
    # is 12 s: a split that did not commit by 88 s did not test the shape, and the verdict says so.
    - { at: 76s, fault: split, target: camus3, duration: 10s, split_timeout_seconds: 12, split_retries: 24 }
checks:
  max_recovery_seconds: 45
  require_split: true
teardown: true
