# Does held history survive a chain of installs, and a fork during an export? Driven by tools/branch/chain-repro.py, which replaces all
# three replicas of the partition in turn and reads every branch through each new one. This scenario supplies the load. Six nodes so three
# can leave and still leave three. 200,000 rows because the export then takes long enough to fork and write inside it. The rebalancer is
# on because a leave only evacuates replicas with it on. The leader balancer stays off so leadership stays where the driver puts it.
# The kill at the end only makes the nemesis start its timeline, which the driver reads for its clock; it lands after the driver has
# finished. Image heldhistory2 = CamusDB 74f1fa2c with Kahuna.Core built from 53547e45 plus the held-history install fix, baked with the
# certificates for nodes + spares = 10. Another count would regenerate them and rebuild this tag from ~/camusdb, without the fix.
name: branch-chain-rocksdb
cluster:
  name: branchchainrocks
  nodes: 6
  spare_certs: 4
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: false
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 4096
  kahuna:
    storage: rocksdb
    wal_storage: rocksdb
    rocksdb_shared_memory_budget_mb: 768
    rocksdb_shared_memtable_budget_mb: 256
  env:
    MALLOC_ARENA_MAX: "2"
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:heldhistory2"
workload:
  kind: bank
  database: caraxes
  rows: 200000
  mode: closed
  workers: 96
  connections: 48
  duration: 58m
  warmup: 1m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
nemesis:
  seed: 1
  events:
    - { at: 56m, fault: kill, target: leader, duration: 15s }
checks:
  require_recovery: false
  require_progress_under_fault: false
teardown: true
