# Same as branch-size-noholds-rocksdb with 8 GiB per node: at 4 GiB the export ran two replicas out of memory, which hid the receive cap.
# Can a replica be seeded when one partition's snapshot passes the 512 MiB receive cap, with no database branch involved? Driven by
# tools/branch/size-repro.py. Earlier exports ran about 0.8 KiB per revision, so 900,000 rows should come to about 700 MiB. One partition on
# purpose, because that is what puts every row in one snapshot. Image heldhistory2 = CamusDB 74f1fa2c with Kahuna.Core built from 53547e45
# plus the held-history install fix, baked with the certificates for nodes + spares = 10. Another count would regenerate them and rebuild
# this tag from ~/camusdb, without the fix. The kill at the end only makes the nemesis start its timeline, which the driver reads for its
# clock; it lands after the driver has finished.
name: branch-size-noholds-8g-rocksdb
cluster:
  name: branchsize
  nodes: 5
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: false
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 8192
  kahuna:
    storage: rocksdb
    wal_storage: rocksdb
    rocksdb_shared_memory_budget_mb: 768
    rocksdb_shared_memtable_budget_mb: 256
  env:
    MALLOC_ARENA_MAX: "2"
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:heldhistory2"
workload:
  kind: bank
  database: caraxes
  rows: 900000
  mode: closed
  workers: 64
  connections: 32
  duration: 22m
  warmup: 1m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
nemesis:
  seed: 1
  events:
    - { at: 20m, fault: kill, target: leader, duration: 15s }
checks:
  require_recovery: false
  require_progress_under_fault: false
teardown: true
