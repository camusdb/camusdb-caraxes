# FIX VERIFICATION — identical to bank-soak-p1-w128.yml, run against the BatchStreamTracker fix.
#
# WHAT IS BEING VERIFIED. camusdb 55ffdaf6 "Bound gRPC batch stream task tracking memory" replaced
# BatchExecute's unbounded `List<Task> ops` and per-handle `Dictionary<..., Task> chains` with
# `BatchStreamTracker`: an outstanding-op counter plus a completion signal for teardown, and a chain
# map swept of completed entries at twice the read-buffer limit. Feature `7100c79b` measured the
# defect at exactly **1.00 retained async state machine per gatewayed request** — 2,906,601 boxes
# against 2,912,492 requests on one node — worth ~0.18 KiB/op of the 0.258 KiB/op total live growth.
#
# THE COMPARISON. This scenario is byte-for-byte `bank-soak-p1-w128.yml` (1 partition, 128 workers,
# 4096 MB/node, 45-minute window, no nemesis, caches left at proportional sizing). The pre-fix run
# `bank-soak-p1-w128-s1` is the baseline, measured by `tools/memdecomp`:
#
#     docker 0.440 KiB/op | live 0.258 | native 0.151 | gc_slack 0.021 | cache+k 0.002
#     throughput 2,761 ops/s in the first 5 min decaying to 1,880 by minute 45 (-33%)
#     peak RSS 4,056 MiB of 4,096 (99%)
#
# WHAT FALLS OUT OF EACH OUTCOME.
#   - live drops to roughly 0.08 KiB/op and docker to ~0.26 -> the fix removes what it claimed and
#     the remaining live growth is something else (TransactionRecord, receipts, Kommander RaftLog).
#   - live unchanged -> the tracker is not actually dropping the state machines; check whether the
#     chain sweep runs at all at this maxBuffered, and re-dump.
#   - live drops but throughput still decays -> decay was never memory-driven, which would overturn
#     the mechanism recorded in `41b2d6bf`.
#
# NOTE the decay and the peak RSS as well as the slope: if growth per operation falls but the run
# still ends near its cap, the fix helps without being sufficient, and `efa86ffa` stays open on the
# native/RocksDB term (0.151-0.351 KiB/op, untouched by this change).
#
# NO HEAP DUMPS in this run. A full core dump freezes the node for minutes and fails the health
# check (see `7100c79b`); this run must stay clean so its curve is comparable with the baseline.
name: bank-soak-fix-p1-w128
cluster:
  name: banksoakfixp1w128
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 4096
  camusdb_repo: "~/camusdb"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 128
  connections: 64
  duration: 45m
  warmup: 2m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
