# Re-run of bank-leader-transfer-nvme-192 on the Kahuna working tree packed as Kahuna.Core 1.9.3-fence.1
# (~/kahuna at 83658b2b "Fence stale leaders and detect apply drift" plus its uncommitted work:
# DurableOrderedApplyAwaiter, the replica-fence lag tracker, write-aggregator and persistence-backlog
# changes). Resolves Kahuna.Shared 1.9.3-fence.1 and the published Kommander 1.7.4; CamusDB.Core is
# pinned to the local pack through .localnuget/nuget.config, and docker/Dockerfile copies both into
# the build context again. Restore the pin and revert those two files before committing CamusDB.
#
# What this stack adds over 1.9.2/1.7.3, and therefore what to read in the artifacts:
#   * the ordered-apply rendezvous — a completion for a locally proposed durable entry waits for that
#     entry's own ordered apply instead of judging the delta early. This is the rule aimed at the lt3
#     divergence (Kahuna feature f91b6784): an ex-leader alone rejecting a bundled commit its peers
#     admitted. Counters `kahuna.durable_tx.ordered_apply_wait_timeouts` (expected 0) and
#     `kahuna.durable_tx.ordered_apply_results_displaced` (expected 0), plus the warning
#     "did not see its ordered apply within 10000ms".
#   * the apply fingerprint compared at every promotion. Counter
#     `kahuna.keyvalues.apply_divergence_detected` (expected 0) and the error line
#     "apply divergence on partition N at promotion".
#   * quorum-confirmed actor-only mutations and the Kommander 1.7.4 term fence. Warning
#     "Refusing an actor-state mutation on partition N" — a few at a failover are expected, a stream
#     from one node is not — and "leadership of partition N lost in term M; dropping the staged
#     transactional writes and exclusive locks".
#   * the throughput question the rendezvous raises: it puts a wait on the durable commit path, so
#     compare the run-wide rate and the write p99 against lt6 on the same shape and device
#     regime before reading anything else as a win.
#
# LEADER TRANSFER UNDER LOAD, on the published stack (CamusDB Phase 5 fault matrix row 3).
#
# Same shape as bank-leader-transfer-nvme-transfer1-info (lt5): three graceful handovers of the data
# partition's leadership at 4m / 6m / 8m while the bank workload commits at full rate, driven through
# CamusDB's POST /v1/cluster/transfer-leadership from inside the leader's network namespace.
#
# What is new here is the stack. lt3-lt5 ran on local packs (Kommander 1.6.11-transfer.1 / Kahuna.Core
# 1.8.6-transfer.1) and lt5 exercised the FIRST version of the converging handover — proposals refused
# with NodeIsNotLeader while the node still led, demotion inside CompleteAppendLogsAsync. The hardening
# that run lt3's lost write prompted (proposals parked until the handover has published the new leader;
# the handover run as its own executor operation off a posted nudge, not inside the levelling ack) is
# Kommander commit 38a5e2b, shipped in 1.6.11 and carried into the published 1.7.3 that Kahuna.Core
# 1.9.2 resolves. This is its first run under load, and the first leader-transfer run on a published
# package since lt2.
#
# Reads this run is for, in order:
#   1. Reconciliation and row attribution. lt3 lost exactly one committed write (row 1543, SUM(balance)
#      +1) through a non-unanimous apply-time rejection on the ex-leader; 9 handovers since have been
#      clean, so a recurrence is not expected — but it is the reason the Information logging below stays
#      on, and reconciliation is the gate that would catch it.
#   2. Apply-time rejections unanimous across the three replicas (lt3: 16/15/15; lt4: 51 unanimous;
#      lt5: 19/19/19). Kahuna's per-node fingerprint at each leader change — "KeyValues: leader for
#      partition 1 is now <endpoint> (local applied kv log id N, committed heads N, live intents N)" —
#      must read identically on all three nodes, and the ex-leader's demotion-time line must carry the
#      index Kommander reports as "reached #N". That pairing localizes a recurrence to the ack-path
#      demotion; it is why the run is at Information.
#   3. Kommander feature 31098233's first done-when bullet: every handover on the first ask. The
#      harness's retry loop is now MaxAttempts = 1, so a ReplicationFailed answer fails the run
#      instead of being retried away.
#   4. Zero indeterminate writes. A graceful handover has a live coordinator throughout, so every
#      in-flight commit must get a verdict (lt1-lt5: 0 every time).
#
# The balancer bullet of 31098233 cannot be answered here: with partitions: 1 there is no imbalance for
# LeaderBalancePlanner to plan a move against, so no TransferSuggestion outcome line is ever written.
# That needs a multi-partition scenario and is deliberately out of scope for this comparison.
#
# Device note: the host NVMe's idle fsync probe read 2.76 ms p50 before launch, which is its slow
# regime, but the idle probe is not the in-run signal (lk13 opened at 0.03-0.05 ms after a 2.9 ms idle
# probe). Grade throughput from host-io.csv through the verdict's own regime rules; the correctness
# reads above are device-independent.
name: bank-leader-transfer-nvme-193
cluster:
  name: bankleadertransfer193
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 4096
  kahuna:
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
  # Kept from lt5: Kommander and Kahuna at Information on every node, so a recurrence of the lt3
  # divergence carries the converging-transfer lines (armed / caught up / handing over) and Kahuna's
  # per-node apply fingerprints next to the rejection. It costs throughput (lt5 ran at 4,142 ops/s
  # against lt4's 4,930), so this run's rate is not comparable with lt1-lt4 — lt5 is its comparison.
  log_levels:
    Kommander: Information
    Kahuna: Information
  camusdb_repo: "~/camusdb"
  # Published stack: Kahuna.Core 1.9.2 -> Kahuna.Shared 1.9.2 -> Kommander 1.7.3, all from nuget.org;
  # CamusDB.Workload on the released CamusDB.Client 0.12.3. CamusDB working tree at 734fd1d4 plus the
  # uncommitted POST /v1/cluster/transfer-leadership endpoint the fault needs. cluster-facts.json is
  # the record of what actually ran.
  image: "caraxes/camusdb:bankfence193"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 128
  connections: 64
  duration: 10m
  warmup: 2m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
  scan_probe_interval: 5s
nemesis:
  seed: 1
  events:
    - { at: 4m, fault: leader-transfer, target: leader, duration: 10s }
    - { at: 6m, fault: leader-transfer, target: leader, duration: 10s }
    - { at: 8m, fault: leader-transfer, target: leader, duration: 10s }
checks:
  max_recovery_seconds: 15
  min_recovered_throughput_fraction: 0.9
  require_recovery: true
  require_progress_under_fault: true
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
