# 45-MINUTE PAIRED BASELINE — 3 partitions, 32 workers, 1536 MB/node. THE FROZEN CONFIG, SOAKED.
#
# WHY THIS IS REQUIRED. The 45-minute soaks of the candidate cells showed PROGRESSIVE DEGRADATION:
# w128 ran 2,817 ops/s in its first 10 minutes and 1,880 in its last 5; w256 ran 3,347 and ended at
# 1,776. So every 5-minute capacity number in this campaign was measuring a transient, and the
# candidate can no longer be compared against a 5-minute baseline. A ratio is only meaningful
# between MATCHED windows.
#
# The plan's own rule: the claim must use "the exact workload, topology, durability settings, data
# shape, client version, and hardware" as the baseline. Window length is part of that. Comparing a
# 45-minute candidate against a 5-minute baseline would inflate the ratio if the baseline degrades
# too — and there is direct reason to think it does: the archived 45-minute bank runs recorded
# 208-216 ops/s where the 5-minute frozen baseline records 407.86, which is roughly a factor of two.
# Those archives are Mac-era and carried nemesis faults, so they cannot be used. This run replaces
# them on the current host and stack, fault-free.
#
# CONFIGURATION IS THE FROZEN BASELINE, UNCHANGED: 3 partitions, 32 workers, 1536 MB/node, 2,000
# rows, 50/50. Memory is deliberately NOT raised. The baseline peaked at 949 MiB of 1,536 in the
# 5-minute campaign and never came near its cap, so raising it would change a variable that is not
# binding and break the pairing with the frozen 407.86 figure.
#
# WHAT FALSIFIES WHAT.
#   - Baseline degrades by a similar proportion -> degradation is a property of the workload/engine,
#     not of the one-partition topology, and the paired RATIO survives even though both absolute
#     numbers fall. This is the outcome that would keep a 10x claim alive.
#   - Baseline holds flat while the candidate decays -> the degradation is specific to the
#     one-partition configuration, the ratio collapses over time, and the topology result cannot be
#     claimed as a sustained improvement at all.
#   - Baseline degrades MORE than the candidate -> the topology change improves stability as well as
#     throughput, which would be a stronger result than the 5-minute campaign suggested.
#
# WATCH MEMORY. The candidate soaks grew monotonically to 99% (w128) and 96% (w256) of their caps
# over 45 minutes and were still climbing — feature `efa86ffa`, "node memory grows without bound
# under the bank workload". Whether the 3-partition baseline does the same at 1536 MB decides
# whether that growth is a property of the engine or of the consolidated topology.
name: bank-soak-base-p3-w32
cluster:
  name: banksoakbasep3w32
  nodes: 3
  partitions: 3
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 1536
  camusdb_repo: "~/camusdb"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 32
  connections: 16
  duration: 45m
  warmup: 2m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
  require_spread_leadership: true
teardown: true
