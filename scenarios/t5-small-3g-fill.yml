# GC and write-hold defaults (2026-11-20): single-node k117-sol-tmpfs-n1 body, store and WAL on the host NVMe, 4-minute warm-up and 6-minute window, one change per arm.
# 1 node of 3,072 MiB on the host NVMe, 64 workers, image t5, heap limit 1,843 MiB, Solarium budgets sized by CamusDB, the 1 ms hold with precise wake and the fill-target trigger, the runtime's GC defaults.
# Run with --skip-build.
name: t5-small-3g-fill
cluster:
  name: t5sm3gfill
  nodes: 1
  partitions: 1
  replication_factor: 1
  placement_rebalancer: false
  leader_balancer: false
  key_range_sharding: false
  locking: optimistic
  isolation: serializable
  diagnostics: true
  memory_limit_mb: 3072
  gc_heap_hard_limit_mb: 1843
  tls: false
  kahuna:
    storage: solarium
    wal_storage: solarium
    durable_materialize_on_resolve: true
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
    key_value_write_precise_wake: true
    key_value_write_fill_target_trigger: true
  env:
    MALLOC_ARENA_MAX: "2"
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:t5"
  camusdb:
    point_read_row_id_cache_enabled: true
    optimistic_intent_wait_ms: 100
    serializable_optimistic_point_locks: false
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 64
  connections: 64
  duration: 6m
  warmup: 4m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
