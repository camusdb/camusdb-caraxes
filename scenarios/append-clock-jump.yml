# Elle list-append while one node's wall clock jumps forward past the 5 s snapshot clock-fence lead
# (Kahuna KeyValueActor.MaxSnapshotClockLeadMs). A read-only snapshot transaction whose read timestamp
# is minted on the jumped node and served by a node whose HLC has not caught up yet skips the serving
# node's clock fence, and a later commit can then land inside its snapshot. The HLC merges to the
# highest clock it hears and keeps that lead after the heal, so each jump must lead the previous one
# by more than 5 s to open a new window: +10 s, then +15 s and +20 s, 30 s apart. Watch
# kahuna_kv_snapshot_clock_fence_skipped_total on the nodes to confirm the path ran. PASS needs a
# serializable history.
name: append-clock-jump
cluster:
  name: append-clock
  nodes: 3
  partitions: 3
  replication_factor: 3
  locking: pessimistic
  isolation: serializable
  clock_skew: true
workload:
  kind: append
  database: caraxes
  rows: 1000
  mode: closed
  workers: 16
  duration: 120s
  warmup: 10s
  read_percent: 40
  write_percent: 60
  append_keys: 8
nemesis:
  events:
    - { at: 15s, fault: clock-skew, target: camus1, duration: 20s, offset_ms: 10000 }
    - { at: 45s, fault: clock-skew, target: camus2, duration: 20s, offset_ms: 15000 }
    - { at: 75s, fault: clock-skew, target: camus3, duration: 20s, offset_ms: 20000 }
teardown: true
