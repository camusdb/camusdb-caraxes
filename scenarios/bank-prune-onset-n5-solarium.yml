# CONTROL for the throughput decline seen in bank-fault-soak-nvme-n5-solarium-install (2026-11-17): the same five-node cluster
# and bank workload with no faults, 30 minutes, and the point-in-time-recovery window lowered from the default 3600 s to 600 s
# (base snapshot interval 300 s, which must not exceed the window). Persisted MVCC revisions are pruned once they are older than
# the window, so the pruner should start about 10 minutes after the first writes instead of 60. What to read: whether throughput
# steps down, and WAL write time, gen-2 collections and host disk reads step up, when
# kahuna_persistence_revision_prune_revisions_deleted_total starts to move.
name: bank-prune-onset-n5-solarium
cluster:
  name: bankpruneonsetn5
  nodes: 5
  partitions: 1
  replication_factor: 5
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 4096
  kahuna:
    storage: solarium
    wal_storage: solarium
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
    pitr_window_seconds: 600
    base_snapshot_interval_seconds: 300
    durable_materialize_on_resolve: true
    rocksdb_shared_memory_budget_mb: 768
    rocksdb_shared_memtable_budget_mb: 256
  env:
    MALLOC_ARENA_MAX: "2"
  camusdb_repo: "~/camusdb"
  camusdb:
    point_read_row_id_cache_enabled: true
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 48
  connections: 24
  duration: 30m
  warmup: 3m
  drain: 60s
  read_percent: 50
  write_percent: 50
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
  scan_probe_interval: 5s
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
