# Ordered-lane A/B (Kahuna ba8ac16a): body of kr146-fanout-kr.yml, unchanged except name, cluster name and image.
# base = caraxes/camusdb:lane0 (Kahuna.Core 1.17.2), cand = caraxes/camusdb:lane1 (Kahuna.Core 1.17.3-lane.1:
# the durable inter-node handlers take no ordered-lane turn). Same CamusDB tree (492c809c) for both.
name: lane-ab-fanout-kr-base
cluster:
  name: laneabfanoutbase
  nodes: 3
  partitions: 3
  replication_factor: 3
  key_range_sharding: true
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 6144
  kahuna:
    # Held constant across both arms.
    recent_heartbeat_ms: 25
    # The shipping default as of `529f8611`, stated rather than inherited so the manifest names it.
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
  camusdb_repo: "~/camusdb"
  # ONE image for both arms: routing is a client-side behaviour, so the server binary must not differ.
  image: "caraxes/camusdb:lane0"
workload:
  kind: fanout
  database: caraxes
  rows: 12000
  tables: 3
  mode: closed
  workers: 32
  connections: 16
  duration: 10m
  warmup: 1m
  drain: 30s
  read_percent: 50
  write_percent: 50
  routing_mode: off
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
settle_seconds: 90
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
