# TRACE LAB, not a figure: the w128 body with a 9-minute warm-up and a 1-minute window, so EventPipe session variants can be tried by
# hand against a loaded cluster node (dotnet-trace 9.x and 10.x stall on a cluster node under this load but complete on a standalone
# node from the same image). Checks that grade a figure are off; the run exists for its warm-up.
name: bank-rel1118-tmpfs-clear-tracelab
cluster:
  name: bankrel1118tracelab
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 9728
  data_tmpfs_mb: 6144
  gc_heap_hard_limit_mb: 2458
  tls: false
  kahuna:
    # ON, and stated rather than inherited: this is CamusDB's default as of `529f8611`.
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:bankrel1118"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 128
  connections: 64
  duration: 1m
  warmup: 9m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
checks:
  require_client_headroom: false
  require_cluster_facts: true
  require_quiet_host: false
teardown: true
