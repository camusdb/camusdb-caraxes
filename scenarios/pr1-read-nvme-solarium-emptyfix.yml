# pr1 (2026-11-15): the pr1-read-nvme-solarium-k1171 body (5,000,000 rows, defaults) on image k1171e, a local Kahuna.Core 1.17.2-empty.1 build whose unflushed-writes index answers IsEmpty from a counter. Baseline on k1171: 21,775 reads/s.
name: pr1-read-nvme-solarium-emptyfix
cluster:
  name: pr1nvse
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: serializable
  diagnostics: true
  memory_limit_mb: 4096
  kahuna:
    storage: solarium
    wal_storage: solarium
    one_phase_apply_time_validation: true
    durable_materialize_on_resolve: true
    rocksdb_shared_memory_budget_mb: 768
    rocksdb_shared_memtable_budget_mb: 256
  env:
    MALLOC_ARENA_MAX: "2"
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:k1171e"
  camusdb:
    point_read_row_id_cache_enabled: true
    optimistic_intent_wait_ms: 100
    serializable_optimistic_point_locks: false
workload:
  kind: accounts
  database: caraxes
  rows: 5000000
  payload_bytes: 256
  batch: 1000
  mode: closed
  workers: 256
  connections: 64
  duration: 10m
  warmup: 3m
  drain: 30s
  read_percent: 100
  write_percent: 0
  expect_faults: false
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
