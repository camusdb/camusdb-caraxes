# ARM B STACK (2026-10-12): CamusDB pins the published Kahuna.Core 1.11.8 -> Kahuna.Shared 1.11.8 -> Kommander 1.10.8. Kahuna 1.11.8 carries
# the arm B read-path work (kahuna.kv.read.stage histogram; the PreparedIntentStore and PartitionDivergenceContainment IsEmpty bucket-lock
# guards replaced); Kommander 1.10.8 refreshes the leadership lease from the ack stream and lets a lagging lease reader wait on the applied
# frontier instead of taking an executor read-index round. CLEARTEXT client path (tls: false), which is the control shape from today on:
# the TLS/cleartext pair on 1.11.7 (tr2) read 9,082 vs 9,240 ops/s at an identical 0.90 leader CPU-ms/op, so the client-side TLS was never
# the cost. Raft stays TLS. Image caraxes/camusdb:bankrel1118. Body = the 45-minute figure-of-record shape (2-minute warm-up): compares with 9,031 (TLS, 1.10.2) and 8,866 (TLS, 1.11.7). Bar: >10,000.
# No profiling env; the read-stage histogram is a production instrument and is scraped through /metrics like cycle_stage.
name: bank-rel1118-tmpfs-clear-45
cluster:
  name: bankrel1118clear45
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 9728
  data_tmpfs_mb: 6144
  gc_heap_hard_limit_mb: 2458
  tls: false
  kahuna:
    # ON, and stated rather than inherited: this is CamusDB's default as of `529f8611`.
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:bankrel1118"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 128
  connections: 64
  duration: 45m
  warmup: 2m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
