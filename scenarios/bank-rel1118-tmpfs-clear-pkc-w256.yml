# PRIMARY-KEY ROW-ID CACHE at 256 WORKERS (2026-10-12): the pkc-w128 body with twice the closed-loop concurrency. Why: with the cache
# the leader runs 8.0-8.1 cores instead of 8.3 at 128 workers (pkc1 9,642 ops/s, 0.83 CPU-ms/op; pkc3 45-min 9,903, 0.82) and the loop
# is partly bound by the 7.5 ms COMMIT, i.e. there is CPU headroom a higher concurrency can convert; the 2026-10-11 sweep converted the
# same step into +5% at constant CPU per op (9,004 -> 9,507). Compare with pkc1 (128 workers, same image and config) and with sweep1's
# w256-c64 (9,507 ops/s, write p50 38 ms, 5 conflict-exhausted writes). Read: ops/s, leader CPU-ms/op and cores, client p50/p99, the
# headroom check (pool queue), conflict-exhausted writes. If it clears 10k by a margin, the 45-minute shape at 256 workers follows.
name: bank-rel1118-tmpfs-clear-pkc-w256
cluster:
  name: bankrel1118clearpkcw256
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 9728
  data_tmpfs_mb: 6144
  gc_heap_hard_limit_mb: 2458
  tls: false
  kahuna:
    # ON, and stated rather than inherited: this is CamusDB's default as of `529f8611`.
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:bankrel1118pkc"
  camusdb:
    # The lever under test: a primary-key point lookup remembers its row id and skips the index read.
    point_read_row_id_cache_enabled: true
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 256
  connections: 64
  duration: 10m
  warmup: 6m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
