# ADD COLUMN ON A BUSY TABLE WHILE THE NODES DIE ONE BY ONE. The bank workload transfers across the whole keyspace while
# the column fill re-encodes every row. The fill outlasts three rolling kills, so whichever node leads the schema
# partition dies with the coordinator job in flight, and the job must be resumed by the next schema leader:
#   30s   ADD COLUMN tier DEFAULT 7, sent to camus2       -> the fill runs ~1 s per 1,000 rows on this table under load
#   36s   kill camus2 for 15 s                              -> the node holding the client's request: the statement is cut
#   56s   kill camus3 for 15 s
#   76s   kill camus1 for 15 s                              -> one of the three led the schema partition
#   120s  the same ADD COLUMN again, on camus1              -> refused as a duplicate if the job finished, added if it rolled back
#   190s  ADD COLUMN seq GENERATED BY DEFAULT AS IDENTITY   -> every existing row draws its own value from a new sequence
#   193s  pause camus3 for 20 s                             -> a node that cannot ack: the gate waits out its 30 s lease
# After the workload, tier must exist on every node and hold 7 in every row, seq must exist with no NULL and no repeat,
# the ledger must conserve (the fill rewrites rows the transfers update; a fill that overwrote a transfer loses money),
# and at least one coordinator job must have been resumed (require_resume): a run in which the fill beat the kills
# tested nothing about recovery, and fails as VACUOUS.
#
# RUN k1 (2026-10-20, FAIL, image bankpitr3; the re-send was at 130 s and the identity column at 150 s, so the pause
# overlapped the re-send). The ledger reconciled through all three kills. The kill of camus2 cut the first ALTER 6 s
# into its fill and the next schema leader rolled tier back (WriteOnly -> DeleteOnly -> Absent). The re-sent ALTER
# reached WriteOnly; the pause moved the schema leader to camus2, which logged "Resuming coordinator job for
# workload_accounts.tier -> Public" and one second later "Coordinator resume failed ... commit was aborted by the
# coordinator (conflict)", and rolled tier back again: the fill retries a 256-row batch 8 times
# (TableColumnAdder.BatchAttempts) and the coordinator then takes the column back, which on this table happens on the
# first run of an ALTER as well as on a resume. The identity column hit "CreateSequence ...
# was not committed: NotLeader" as CADB0099. All three nodes agreed the columns were absent; nothing was half-built.
#
# RUN k2 (2026-10-20, FAIL, this schedule). The cut ALTER was again rolled back after the kill; the re-send at 120 s
# succeeded on its third attempt in 40 s, and tier then held 7 in all 60,000 rows on all three nodes, with the ledger
# reconciled: the operator's re-run works and the fill lost no transfer. The identity column is where it breaks:
# while seq was WriteOnly, 7,993 transfers were refused CADB0301 "Column 'seq' cannot be null" (51% of writes for the
# 23 s window; an identity column is NOT NULL, so every UPDATE of an older row trips it). The pause of camus3 moved the
# schema leader to camus1, which resumed seq -> Public, lost a fill batch to a transfer ("Coordinator resume failed ...
# (conflict)", the k1 finding again), rolled seq back and dropped its sequence G9; 13 s later the statement's original
# driver, still running, failed with CADB0543 "sequence 'G9' no longer exists". The nodes agreed seq was absent.
#
# RUN k3 (2026-10-20, correctness PASS, image schemafix1 = CamusDB 00027613; FAIL only on the throughput hold after the
# camus1 kill). The kill cut the first ALTER and the next schema leader resumed tier to Public (require_resume met); the
# re-send was refused as a duplicate column. The identity column was resumed to Public through the pause (its first
# answer was a retryable refusal, the re-send a duplicate). tier holds 7 and seq is distinct and non-NULL in all 60,000
# rows on all three nodes, the ledger reconciled, and no transfer was refused CADB0301 or CADB0099.
name: schema-add-column-kill
cluster:
  name: schema-add-column-kill
  nodes: 3
  partitions: 3
  replication_factor: 3
  locking: optimistic
  isolation: read_committed
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:schemafix1"
workload:
  kind: bank
  database: caraxes
  rows: 60000
  mode: closed
  workers: 32
  connections: 16
  duration: 280s
  warmup: 15s
  drain: 10s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  scan_probe_interval: 5s
nemesis:
  seed: 1
  events:
    - { at: 30s,  fault: sql,  target: camus2, duration: 5s, expect: any, sql: "ALTER TABLE workload_accounts ADD COLUMN tier INT64 NOT NULL DEFAULT (7)" }
    - { at: 36s,  fault: kill, target: camus2, duration: 15s }
    - { at: 56s,  fault: kill, target: camus3, duration: 15s }
    - { at: 76s,  fault: kill, target: camus1, duration: 15s }
    - { at: 120s, fault: sql,  target: camus1, duration: 5s, expect: any, sql: "ALTER TABLE workload_accounts ADD COLUMN tier INT64 NOT NULL DEFAULT (7)" }
    - { at: 190s, fault: sql,  target: camus2, duration: 5s, expect: any, sql: "ALTER TABLE workload_accounts ADD COLUMN seq INT64 GENERATED BY DEFAULT AS IDENTITY" }
    - { at: 193s, fault: pause, target: camus3, duration: 20s }
schema_verify:
  require_resume: true
  columns:
    - { table: workload_accounts, name: tier, value: "7" }
    - { table: workload_accounts, name: seq, distinct: true }
checks:
  max_recovery_seconds: 60
teardown: true
