# RELEASED ROUND STACK (2026-09-28): CamusDB HEAD pinned to Kahuna.Core 1.10.2 (nuget.org; Kahuna 885e9571: cycle_stage stamps,
# precise-wake knob off, lock-free window, materialize-on-resolve flag off) -> Kommander 1.9.1 (nuget.org; the fc4dabe7 task 3 round
# fixes + ordered per-peer append stream + apply-drain gate). Image caraxes/camusdb:bankrel1102. Plan 84b26503 critical path (3):
# 45-MINUTE FIGURE OF RECORD candidate: the p45learned182 shape (45 min, 2-min warm-up, learned routing, 128 workers) on the released
# round stack. The figure of record needs every check green, require_client_headroom included (the r3 arms failed it at pool queue
# 102-107); freeze record per a9691c37 section 5. Compare with p45learned182 (8,200 ops/s, raft 2.20 ms) and r3a2/r3a4 (9,094 / 9,264).
name: bank-rel1102-tmpfs-learned-45
cluster:
  name: bankrel1102tmpfs45
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 9728
  data_tmpfs_mb: 6144
  gc_heap_hard_limit_mb: 2458
  kahuna:
    # ON, and stated rather than inherited: this is CamusDB's default as of `529f8611`.
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
  camusdb_repo: "~/camusdb"
  # Both arms share ONE image built once from ~/camusdb, so the only difference between them
  # is the cluster shape. Rebuilding per arm would leave the source identity of each arm resting
  # on the build being reproducible, which is a weaker guarantee than not rebuilding.
  image: "caraxes/camusdb:bankrel1102"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 128
  connections: 64
  duration: 45m
  warmup: 2m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
