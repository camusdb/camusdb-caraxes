# iw6 (2026-11-12): Serializable + optimistic, single-key reads proved at commit, reads held to one point in time per transaction, head stamped at install (local pack 1.16.8-readfloor.5, image iw7; the install time now travels with the published head, experiment).
name: iw7-ser-nolocks-floor
cluster:
  name: iw7serfl
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  # The routing mode under test, stated explicitly so the arm does not depend on the build's default.
  key_range_sharding: false
  locking: optimistic
  isolation: serializable
  diagnostics: true
  memory_limit_mb: 8192
  data_tmpfs_mb: 6144
  gc_heap_hard_limit_mb: 2458
  tls: false
  kahuna:
    # ON, and stated rather than inherited: this is CamusDB's default as of `529f8611`.
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:iw7"
  camusdb:
    # The default since edcb9fab, stated so every arm reads the same.
    point_read_row_id_cache_enabled: true
    optimistic_intent_wait_ms: 100
    serializable_optimistic_point_locks: false
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 256
  connections: 64
  duration: 10m
  warmup: 6m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
