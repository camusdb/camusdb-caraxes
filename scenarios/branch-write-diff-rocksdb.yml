# Does a branch behave like a plain database holding the same data? Driven by tools/branch/write-diff.py. The bank load only keeps the cluster
# busy and supplies the nemesis clock, so it is small. Four data partitions put keys and their indexes on different ones.
# Image heldhistory2 = CamusDB 74f1fa2c with Kahuna.Core built from 53547e45 plus the held-history install fix, baked with the certificates for
# nodes + spares = 10. Another count would regenerate them and rebuild this tag from ~/camusdb, without the fix. The kill at the end only
# makes the nemesis start its timeline, which the driver reads for its clock; it lands after the driver has finished.
name: branch-write-diff-rocksdb
cluster:
  name: branchwritediff
  nodes: 5
  partitions: 4
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: false
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 3072
  kahuna:
    storage: rocksdb
    wal_storage: rocksdb
    rocksdb_shared_memory_budget_mb: 768
    rocksdb_shared_memtable_budget_mb: 256
  env:
    MALLOC_ARENA_MAX: "2"
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:heldhistory2"
workload:
  kind: bank
  database: caraxes
  rows: 5000
  mode: closed
  workers: 8
  connections: 4
  duration: 60m
  warmup: 1m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
nemesis:
  seed: 1
  events:
    - { at: 58m, fault: kill, target: leader, duration: 15s }
checks:
  require_recovery: false
  require_progress_under_fault: false
teardown: true
