# HEADROOM SOAK — 1 partition, 128 workers, 8192 MB/node, caches PINNED at the 4096 MB sizing, 90 min.
#
# THE QUESTION. Does the memory curve plateau, or does it keep climbing? Every soak so far ended with
# memory still rising against a cap it was close to, so "grows without an observed plateau" is all
# the evidence supports. That is not the same as unbounded, and the difference decides whether this
# is a leak-shaped problem or simply a footprint larger than the caps tried so far.
#
# WHY THE OBVIOUS EXPERIMENT IS WRONG. Simply raising `memory_limit_mb` is a TWO-variable change.
# `ApplyMemoryProportionalDefaults` sizes caches from the container limit:
#     block cache   = totalRam / 10   (yielding floor 320 MB, ceiling 2048)
#     memtables     = block cache / 4 (yielding floor 128, ceiling 1024)
#     actor layer   = totalRam / 16, split across max(32, 4 x CPU) = 64 actors
# At 4096 MB that is ~409 + ~102 + ~256 = ~767 MB of caches. At 8192 MB it would be ~1,535 MB. So
# doubling the cap doubles the caches, and a footprint that grew would prove nothing.
#
# THE FIX. All three knobs are pinned to EXACTLY their 4096 MB values, so the cache budget is held
# constant and the ONLY variable against `bank-soak-p1-w128-s1` is headroom. This also sidesteps the
# open question in `efa86ffa` about whether `TotalAvailableMemoryBytes` reports the cgroup limit or
# the 60% managed budget — pinned values do not depend on the answer.
#
# NOT the 64/16 posture. `bank-soak-pinned-p1-w128-s1` tested that and it was worse on every axis:
# -24% throughput, decay deepened from -33% to -42%, 874 failures, a 10.2 s p99, to save 555 MiB. At
# ~1,000 write txns/s the MVCC revision history and fresh SSTs far exceed the 2,000-row logical
# working set, so a 64 MB block cache thrashes. The pinning here preserves the WORKING configuration's
# cache sizes; it does not shrink them.
#
# 90 MINUTES, not 45. Headroom alone is not enough — a plateau needs time to become visible. The
# 45-minute runs were still climbing when they ended, so they cannot distinguish "flattens at 5 GB"
# from "keeps going". Doubling the window is the cheapest way to tell.
#
# WHAT FALSIFIES WHAT.
#   - Footprint flattens well below 8192 and throughput stops decaying -> growth is bounded; the
#     earlier caps were simply too small, and the sustained ratio in `41b2d6bf` (5.77x) is understated
#     because those runs spent their second half in GC distress.
#   - Footprint climbs toward 8192 and throughput decays as before -> growth tracks cumulative work
#     with no plateau in reach, and it is the binding constraint on the whole plan.
#   - Footprint flattens but throughput decays anyway -> decay is NOT memory-driven, and the whole
#     mechanism story in `41b2d6bf` is wrong. This is the outcome that would matter most.
#
# 8192 x 3 = 24 GB on a 31 GB host with ~27 GB available; the w512 run already used this cap safely.
# Run behind the tightened quiesce (load < 0.8 AND Dirty+Writeback < 64 MiB).
name: bank-soak-head-p1-w128
cluster:
  name: banksoakheadp1w128
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 8192
  kahuna:
    # Pinned at exactly what proportional sizing computes for a 4096 MB container, so that raising
    # the container limit to 8192 does NOT also double the cache budget. See the header.
    rocksdb_shared_memory_budget_mb: 409
    rocksdb_shared_memtable_budget_mb: 102
    max_bytes_per_actor: 4194304
  camusdb_repo: "~/camusdb"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 128
  connections: 64
  duration: 90m
  warmup: 2m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
