# LEADER TRACE ARM (2026-09-26, Kommander feature fc4dabe7 task 2). Identical to bank-rebase-cand-p1-w128-tmpfs-rel182-learned.yml
# (image caraxes/camusdb:bankrel182: Kahuna.Core 1.8.2 / Kommander 1.6.7, tmpfs, heap pin, learned routing, hold 2 ms) except
# the warm-up is 6 minutes instead of 2. tools/p3c/leader-trace.sh takes a 60 s EventPipe trace of the partition leader and
# then of one follower INSIDE the warm-up, so neither trace perturbs the measured window; the measured 10 minutes are the
# control that says the traced load was the usual regime (compare with the rel182l run: 8,543 ops/s, admissible).
name: bank-rebase-cand-p1-w128-tmpfs-rel182-learned-trace
cluster:
  name: banktmpfsrel182trace
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 9728
  data_tmpfs_mb: 6144
  gc_heap_hard_limit_mb: 2458
  kahuna:
    # ON, and stated rather than inherited: this is CamusDB's default as of `529f8611`.
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
  camusdb_repo: "~/camusdb"
  # Both arms share ONE image built once from ~/camusdb, so the only difference between them
  # is the cluster shape. Rebuilding per arm would leave the source identity of each arm resting
  # on the build being reproducible, which is a weaker guarantee than not rebuilding.
  image: "caraxes/camusdb:bankrel182"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 128
  connections: 64
  duration: 10m
  warmup: 6m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
