# Run Q: run P's attribution soak, repeated on an engine build that carries the Kommander fix.
#
# Run P answered nothing about the -2/-3 conservation deficit. Its first attempt crashed camus3 with
# a SIGSEGV (container exit 139), and its second attempt reconciled FAILED but ran on the same
# unfixed Kommander. The crash diagnosis is a snapshot-rescue livelock into memory exhaustion, filed
# as Kommander dfa6b032: camus1 fell below partition 3's WAL compaction floor, the leader escalated
# to a whole-partition snapshot 32 times in 15 minutes, every install succeeded, and not one
# converged. Kommander 1.3.2 closes it with a consecutive-rescue-cycle counter (RescueNotConverging)
# and a soft restore floor that respects a live follower's cursor
# (CompactionLiveReplicaLagBudget).
#
# Engine build under test:
#   Kommander      1.3.2  (nuget.org — carries both snapshot-rescue fixes)
#   Kahuna         1.3.5  (packed locally from the kahuna working tree; 1.3.4 as published pins
#                          Kommander 1.3.1, so the fix does not reach a soak through it)
#   CamusDB.Core   references Kahuna.Core 1.3.5
#
# Kahuna 1.3.5 carries the same engine code as the published 1.3.4: the prepare-apply staged-base
# fence (19abcfc) and the recordless-intent recovery hold (91d07fe). The only delta against 1.3.4 is
# the Kommander bump. Runs M, N and O all held throughput near 280 ops/s on this fence, so a
# throughput collapse here would be new and would indict the Kommander change.
#
# The scenario body matches runs K/L/M/N/O/P exactly except for the scenario name and the cluster
# name (seed 42, 3 nodes, RF 3, 32 workers over 16 connections, 2,000 contended rows, optimistic /
# read_committed, 45m measure, same nemesis cadence, Kahuna and Kommander at Information).
#
# teardown: false, so the deficit can be re-read after quiescence and node logs collected.
#
# Pass questions, in priority order:
#   1. Does SUM(balance) conserve exactly? Runs N and O lost 3 and 2 units durably, always beside a
#      pause fault, always with exactly two "Trying to commit unknown transaction" events. The
#      per-transfer ledger (transfer-ledger.csv + row-baseline.csv) now names the victim rows by
#      arithmetic, so a deficit is attributable this time instead of merely counted.
#   2. Does the node set survive the whole window? No exit 139, and RescueNotConverging never fires.
#   3. Does throughput hold near 280 ops/s past minute 25?
name: bank-optimistic-45m-q
cluster:
  name: bank-opt-45mq
  nodes: 3
  partitions: 3
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 1536
  log_levels:
    Kommander: Information
    Kahuna: Information
  camusdb_repo: "~/camusdb"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 32
  connections: 16
  duration: 45m
  warmup: 2m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
nemesis:
  seed: 42
  random:
    faults: [pause, slow]
    min_interval: 300s
    max_interval: 480s
    duration: 15s
checks:
  max_recovery_seconds: 60
  require_recovery: false
  require_progress_under_fault: true
teardown: false
