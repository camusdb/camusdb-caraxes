# SHIPPED-STACK STAGES ARM (2026-09-27). Identical to bank-rel1101-tmpfs-learned-trace.yml (same image, same shape, same
# 6-minute warm-up) except KOMMANDER_ROUND_STAGES=1, which turns on Kommander 1.9.0's opt-in per-proposal stage histogram
# raft.round.stage_ms{stage} (leader.queue / propose / wal / wal_completion / fanout / replication / resume, the follower chain,
# leader.ack_queue). CamusDB exports the "Kommander" meter, so the histogram lands in node-metrics.csv. No traces on this arm.
# Its ops/s against the -trace arm is the histogram's own cost; its stage means split the ~2.3 ms round on the real cluster.
name: bank-rel1101-tmpfs-learned-stages
cluster:
  name: bankrel1101stages
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 9728
  data_tmpfs_mb: 6144
  gc_heap_hard_limit_mb: 2458
  kahuna:
    # ON, and stated rather than inherited: this is CamusDB's default as of `529f8611`.
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:bankrel1101"
  env:
    KOMMANDER_ROUND_STAGES: "1"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 128
  connections: 64
  duration: 10m
  warmup: 6m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
