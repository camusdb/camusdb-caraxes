# Two-hour clustered optimistic-locking soak under a seeded random nemesis.
# Bank transfers contend across the keyspace, so optimistic locking is genuinely exercised.
# SUM(balance) conservation is the consistency guard and is never waived, even under fault.
# teardown is off so node logs stay available for a post-mortem; tear down by hand afterwards.
name: bank-optimistic-2h
cluster:
  name: bank-opt-2h
  nodes: 3
  partitions: 3
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  # Bounds each node's Server GC: the generator pairs the cgroup limit with an explicit 60%
  # heap budget (DOTNET_GCHeapHardLimitPercent). Without a limit, three nodes race to the
  # Docker VM ceiling and one gets OOM-killed mid-soak (runs C and E); see
  # runs/probes/memory-gc-2026-08-22/.
  memory_limit_mb: 1536
  # The workload's working set is 2,000 rows x 256 B, so a large RocksDB block cache buys
  # nothing here while its native memory competes with the managed heap inside the container
  # (soak runs G and I died with ~40% of the container pinned in caches sized by the old
  # engine floors). Pin the budgets small to free native headroom. Explicit keys win over the
  # engine's memory-proportional sizing, so this deliberately does not exercise those defaults.
  kahuna:
    rocksdb_shared_memory_budget_mb: 64
    rocksdb_shared_memtable_budget_mb: 16
  camusdb_repo: "~/camusdb"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 24
  duration: 2h
  warmup: 2m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
nemesis:
  seed: 42
  random:
    faults: [kill, pause, partition, slow]
    min_interval: 60s
    max_interval: 120s
    duration: 20s
checks:
  max_recovery_seconds: 60
  require_recovery: true
  require_progress_under_fault: true
teardown: false
