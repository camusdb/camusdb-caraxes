# LOADED-NODE GCDUMP SOAK — 1 partition, 128 workers, 8192 MB/node, caches pinned, 90 min.
#
# PURPOSE. Identical to bank-soak-head-p1-w128.yml. The run itself is not the experiment; the two
# gcdumps taken DURING it are. Feature `efa86ffa` has asked for a loaded-node dump since run J and no
# run has produced one — every dump so far was taken on an idle node (run L), a stalled cluster
# (runs H and J), or after teardown. Those cannot distinguish live-set growth from committed-heap
# growth, which is the question that decides whether the ~0.42 KiB/op accumulation is a leak.
#
# WHY TWO POINTS. One dump gives a number with nothing to compare it to. t+30m and t+60m give a
# SLOPE: if the live set grows between them in proportion to work done, it is accumulation; if it
# stays flat while RSS climbs, the growth is committed-but-collectable heap and GC/native residue.
# Run L measured 41-44 MiB live on an idle node while RSS sat at ~1.1 GiB — that gap is what needs
# resolving under load.
#
# WHY THIS CONFIGURATION. The headroom soak (`bank-soak-head-p1-w128-s1`) established the curve this
# is sampling: memory climbed 3,317 -> 7,853 MiB (96% of an 8192 MB cap) with caches pinned, linear
# at ~0.42 KiB/op across 9M operations, no plateau. Throughput decayed 54% and the cluster ended
# ALIVE BUT UNRESPONSIVE, which is why the dumps must be taken mid-run: by the end it could not even
# be queried for reconciliation.
#
# THE MEASUREMENT PERTURBS THE RUN, DELIBERATELY. `dotnet-gcdump` forces a full blocking GC. Expect a
# throughput dip and an RSS drop at each dump — run L saw a forced collection release 272 MiB. So
# THIS RUN'S THROUGHPUT AND MEMORY CURVE ARE NOT COMPARABLE to the headroom soak and must not be
# quoted as capacity. `bank-soak-head-p1-w128-s1` is the clean curve; this one buys heap composition
# at the cost of the curve.
#
# WHAT FALSIFIES WHAT.
#   - Live set grows substantially t+30 -> t+60 (roughly with cumulative ops) -> genuine accumulation.
#     `efa86ffa`'s "not a leak" conclusion is wrong and the retained types name the culprit.
#   - Live set flat while RSS climbs -> not a leak; the growth is committed heap the GC is holding
#     plus native/segment residue, and the fix is GC configuration or native, not managed lifetime.
#   - Forced GC releases most of the gap at both points -> same conclusion as above, and it also
#     means the degradation is GC bookkeeping rather than live data pressure.
#
# The dump payload is the platform-agnostic net8.0 build of dotnet-gcdump run under
# DOTNET_ROLL_FORWARD=Major with the container's own .NET 10 runtime (the runtime image has no SDK),
# targeting PID 1, per the procedure established on `efa86ffa`.
name: bank-soak-gc-p1-w128
cluster:
  name: banksoakgcp1w128
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 8192
  kahuna:
    # Pinned at exactly what proportional sizing computes for a 4096 MB container, so that raising
    # the container limit to 8192 does NOT also double the cache budget. See the header.
    rocksdb_shared_memory_budget_mb: 409
    rocksdb_shared_memtable_budget_mb: 102
    max_bytes_per_actor: 4194304
  camusdb_repo: "~/camusdb"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 128
  connections: 64
  duration: 90m
  warmup: 2m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
