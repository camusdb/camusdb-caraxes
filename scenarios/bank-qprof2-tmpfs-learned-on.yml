# POINT-READ ATTRIBUTION ARM 'qprof-on' (2026-09-27). The tmpfs learned shape of
# p45learned182 / rel182-learned (tmpfs, heap pin, learned routing, 128 workers, 50/50) on the CURRENT stack: CamusDB
# working tree at ae886c68 plus the opt-in per-stage query profile (QueryStageProfile), the registry generation lease (250 ms) and the per-name stale-hit fix, Kahuna.Core 1.9.11 from nuget.org.
# ONE image (caraxes/camusdb:bankqprof2) for both arms; the only difference is CAMUS_QUERY_STAGE_PROFILE
# (1 = the profile publishes camus_query_profile_* per stage).
# Run 'off' first (it builds the image), then 'on' with --skip-build.
name: bank-qprof2-tmpfs-learned-on
cluster:
  name: bankqproftwoon
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 9728
  data_tmpfs_mb: 6144
  gc_heap_hard_limit_mb: 2458
  kahuna:
    # ON, and stated rather than inherited: this is CamusDB's default as of `529f8611`.
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:bankqprof2"
  env:
    CAMUS_QUERY_STAGE_PROFILE: "1"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 128
  connections: 64
  duration: 10m
  warmup: 2m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
