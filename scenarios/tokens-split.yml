# TOKEN WORKLOAD WHILE KEY RANGES SPLIT. The token table is all churn: every move deletes a key and inserts
# another, so a range that splits under it is copying a key space whose members change every millisecond, and a
# tombstone or a fresh insert that the copy misses is a resurrected or a lost token. 3,000 tokens over a 300-key
# split threshold (the slot index is a key space of its own and splits too), with the split settings of bank-split,
# and a partition and a kill on top. Same verdict as tokens-preflight; require_split fails the run as VACUOUS when
# no split happened during the measured run.
#
# RUN s1 (2026-10-20, image bankpitr3): every correctness check PASS while six partitions appeared (splits) under the
# churn: 3,000 rows for 3,000 tokens, 47,129 moves committed and 34 indeterminate all accounted for per slot, 19,989
# snapshot lookups clean, 174 probes with no short or over count, slot index equal to the primary key on all three
# nodes. Throughput never regained 90% after the camus1 kill. 20 snapshot lookups were refused CADB0502 "Range ... is
# locked" under key-range sharding, although a serializable read-only snapshot is documented as never blocked.
#
# RUN s2 (2026-10-20, FAIL, image schemafix1 = CamusDB 00027613, 5 splits). The snapshot lookups are no longer refused
# by a range lock (20 in s1, 0 here) and throughput rose 19%. The token verdict and the index check pass. The scan
# probe caught a snapshot COUNT(*) of 2,998 of 3,000 on camus3 at 00:16:51Z, in the second the leader balancer moved
# partition 4 back to the restarted camus1 (elected after 0 ms) and 21 in-flight moves were refused with "no longer
# led under term 3": the tokens-faults f1 shape (camusdb 4dc1945f), now under key-range sharding.
#
# RUN s3 (2026-10-21, PASS, image schemafix2 = CamusDB fe98e37b + working tree, Kahuna.Core 1.13.1-schemafix.1 with the
# snapshot-scan projection fence): 60,981 moves exact, 26,212 snapshot lookups clean, 168 probes all exact. The leader
# balancer handed partitions back to camus1 twice with in-flight moves refused (14 at 13:39:17Z, 11 at 13:40:17Z), the
# s2 trigger, and the snapshot counts that overlapped them were whole; the slowest took 6.0 s (p90 1.5 s, s2 0.8 s),
# consistent with the scan waiting out a flush instead of counting short.
#
# RUN s4 (2026-10-21, PASS, image schemafix3, Kahuna.Core 1.13.1-schemafix.2): 52,943 moves exact, 22,607 snapshot
# lookups clean, 168 probes all exact, across a handover that refused 17 in-flight moves.
#
# RUN s5 (2026-10-21, PASS, image kahuna1131, Kahuna.Core 1.13.1): 55,918 moves exact, 23,914 snapshot lookups clean,
# 149 probes all exact, 174 moves gave up.
name: tokens-split
cluster:
  name: tokens-split
  nodes: 3
  partitions: 4
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  key_range_sharding: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:resumefix1"
  kahuna:
    range_split_threshold: 300
    range_split_min_range_size: 100
    range_split_load_threshold: 100
    range_split_load_min_queue_depth: 8
    range_split_load_window_ms: 15000
    range_split_load_poll_interval_ms: 5000
    range_split_load_imbalance_max: 0.8
    range_split_settle_window_ms: 15000
    enable_load_reports: true
workload:
  kind: tokens
  tokens: 3000
  database: caraxes
  rows: 2000
  mode: closed
  workers: 32
  connections: 16
  duration: 150s
  warmup: 15s
  drain: 10s
  read_percent: 30
  write_percent: 70
  expect_faults: true
  scan_probe_interval: 5s
nemesis:
  seed: 59
  events:
    - { at: 40s, fault: partition, target: random, duration: 20s }
    - { at: 90s, fault: kill,      target: random, duration: 20s }
schema_verify:
  stable_seconds: 5
  max_workload_errors: -1
  indexes:
    - { table: workload_tokens, name: workload_tokens_slot, columns: [slot] }
checks:
  max_recovery_seconds: 60
  grade_recovery: false   # a correctness arm: a contended token table under 32 writers collapses into contention after a fault,
                          # so throughput recovery is reported in analysis.md but does not decide the verdict
  require_split: true
teardown: true
