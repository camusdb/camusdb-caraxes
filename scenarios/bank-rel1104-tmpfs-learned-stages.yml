# RELEASED STACK 1.10.4 (2026-09-28): CamusDB HEAD pinned to Kahuna.Core 1.10.4 (b825b7a9: 1.10.3's "refuse a commit whose staging
# a leader change dropped" + the Kommander bump) -> Kommander 1.9.2 (f440f63: ddc146a live-replica WAL retention sized in TIME as
# well as entries; 024525b a follower append is acked before its entries are delivered, and delivered in apply turns of their own).
# CamusDB HEAD also carries the 1 ms post-completion hold and the kahuna.durable_materialize_on_resolve key. Image
# caraxes/camusdb:bankrel1104. Plan 84b26503: rows A6 (the follower executor), A13 (the soak on the released stack).
# stages arm: KOMMANDER_ROUND_STAGES=1. The question is 024525b: does follower.queue (1.24-1.32 ms on rel1102, the propose append
# waiting behind the previous commit's applies) shrink now that the ack precedes delivery? Compare stage by stage with rel1102-stages.
name: bank-rel1104-tmpfs-learned-stages
cluster:
  name: bankrel1104stages
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 9728
  data_tmpfs_mb: 6144
  gc_heap_hard_limit_mb: 2458
  kahuna:
    # ON, and stated rather than inherited: this is CamusDB's default as of `529f8611`.
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:bankrel1104"
  env:
    KOMMANDER_ROUND_STAGES: "1"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 128
  connections: 64
  duration: 10m
  warmup: 6m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
