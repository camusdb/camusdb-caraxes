# STAGES ARM on the Kommander round-cost candidate (2026-09-27). Identical to bank-rel1101-tmpfs-learned-stages.yml (ss1) and
# bank-a6-tmpfs-learned-stages.yml (a6s1) except the image: caraxes/camusdb:bankr3cand (Kommander 1.9.1-round.2, see
# bank-r3-tmpfs-learned-45-cand.yml). KOMMANDER_ROUND_STAGES=1: splits the round by stage for comparison with ss1.
name: bank-r3-tmpfs-learned-stages-cand
cluster:
  name: bankr3stages
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 9728
  data_tmpfs_mb: 6144
  gc_heap_hard_limit_mb: 2458
  kahuna:
    # ON, and stated rather than inherited: this is CamusDB's default as of `529f8611`.
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:bankr3cand"
  env:
    KOMMANDER_ROUND_STAGES: "1"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 128
  connections: 64
  duration: 10m
  warmup: 6m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
