# KAHUNA A/B — the 1.5.8 arm (newest). Partners: bank-soak-k156 (1.5.6) and bank-soak-pre (1.5.7),
#
# all three built from camusdb e4e97531 with ONLY the Kahuna.Core version differing (verified by
# `diff -rq`: the csproj is the sole differing file). 1.5.8 is the newest published build; if the
# 1.5.7 regression is real, the question that matters for CamusDB is whether it is already fixed.
#
# WHY. Comparing `bank-soak-p1-w128-s1` (Kahuna 1.5.6, camusdb c69de80f, 2,183 ops/s, 0 failures)
# against `bank-soak-pre-p1-w128-s3` (Kahuna 1.5.7, camusdb e4e97531, 1,351 ops/s, 4,759 failures)
# suggests the 1.5.6 -> 1.5.7 bump costs ~38% of throughput. **That comparison is confounded**: four
# camusdb commits sit between those builds, including "Optimized schema on disk" (3d9c9c58) and
# "Isolate transaction metrics to owning flow" (75d85f3e). Any of them could own the drop.
#
# Feature `04da7f26` records a Kahuna minor (1.3.2) costing 3x throughput once before, so the
# hypothesis is plausible — which is exactly why it must not be filed against the Kahuna project on
# evidence that cannot separate a dependency from four application commits.
#
# THE ISOLATION. This worktree is camusdb e4e97531 with ONE character changed: Kahuna.Core pinned
# 1.5.7 -> 1.5.6 in CamusDB.Core.csproj. Verified by `diff -rq` against the 1.5.7 worktree: the csproj
# is the only file that differs. Same commit, same tracker-absent state, same scenario, same host.
#
# WHAT FALSIFIES WHAT.
#   - This arm lands near 2,183 ops/s with few failures -> the regression IS the Kahuna bump, and it
#     is worth filing upstream with a clean single-variable pair.
#   - This arm lands near 1,351 like its 1.5.7 partner -> the drop belongs to the camusdb commits in
#     that range, NOT to Kahuna, and the filing goes to CamusDB instead.
#   - Neither -> the drop is host- or run-to-run variance and the whole comparison needs repetitions
#     before anything is claimed. n=1 per arm is thin for a 38% claim either way.
#
# NOTE the live-growth term too: the 1.5.7 control measured 0.326 KiB/op against the older 1.5.6
# baseline's 0.258, so the bump may also worsen the memory growth rate. Same confound applies.
name: bank-soak-k158-p1-w128
cluster:
  name: banksoakk158p1w128
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 4096
  camusdb_repo: "~/camusdb-k158-wt"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 128
  connections: 64
  duration: 45m
  warmup: 2m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
