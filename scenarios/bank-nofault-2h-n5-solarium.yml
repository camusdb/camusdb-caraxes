# NO-FAULT ARM of bank-fault-soak-nvme-n5-solarium-install (2026-11-17): the same five-node cluster and bank workload for two
# hours with the default retention window (3600 s) and no nemesis. It separates the two candidates left by
# bank-prune-onset-n5-solarium for the 25-37% throughput drop at minute 60 of the fault soak: the depth of the history being
# pruned, or the soak's faults and snapshot installs. What to read: throughput, WAL write time per batch, gen-2 collections and
# host disk reads before and after kahuna_persistence_revision_prune_revisions_deleted_total starts to move at about minute 60.
name: bank-nofault-2h-n5-solarium
cluster:
  name: banknofault2hn5
  nodes: 5
  partitions: 1
  replication_factor: 5
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 4096
  kahuna:
    storage: solarium
    wal_storage: solarium
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
    durable_materialize_on_resolve: true
    rocksdb_shared_memory_budget_mb: 768
    rocksdb_shared_memtable_budget_mb: 256
  env:
    MALLOC_ARENA_MAX: "2"
  camusdb_repo: "~/camusdb"
  camusdb:
    point_read_row_id_cache_enabled: true
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 48
  connections: 24
  duration: 2h
  warmup: 3m
  drain: 60s
  read_percent: 50
  write_percent: 50
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
  scan_probe_interval: 5s
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
