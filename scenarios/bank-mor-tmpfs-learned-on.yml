# A9 MATERIALIZE-ON-RESOLVE PAIR (2026-09-28; Kahuna 3b85d8c1 task 5, CamusDB plan 84b26503 row A9). ONE image
# caraxes/camusdb:bankmor1 built from CamusDB HEAD 745f5eb3 (pin Kahuna.Core 1.10.2 -> Kommander 1.9.1; the 1 ms post-completion
# hold; the kahuna.durable_materialize_on_resolve key). The only difference between the two arms is that key: unset (Kahuna's
# default, off: the settle is preceded by one by-reference materialization record per key) vs true (the settle's apply installs
# the committed values on every replica, no materialization records). Design expectation: Raft entries per commit 6.0 -> ~4.0,
# write submissions per commit 4.0 -> ~2.0, follower CPU per op down; tmpfs throughput was never entry-bound, so ops/s may not
# move. Both arms run at hold 1 ms, so the off arm is the baseline for this pair (not ss1 / rl2, which ran at hold 2).
# Correctness on the on arm: exact reconciliation, materialization_intent_missing 0, 0 failed writes.
name: bank-mor-tmpfs-learned-on
cluster:
  name: bankmoron
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 9728
  data_tmpfs_mb: 6144
  gc_heap_hard_limit_mb: 2458
  kahuna:
    # ON, and stated rather than inherited: this is CamusDB's default as of `529f8611`.
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
    durable_materialize_on_resolve: true
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:bankmor1"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 128
  connections: 64
  duration: 10m
  warmup: 6m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
