# Proves the path of tools/branch/install-repro.py up to its negative control, on a small dataset, before the two arms.
name: branch-install-repro-preflight
cluster:
  name: branchrepropre
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: false
  leader_balancer: false
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 4096
  kahuna:
    storage: rocksdb
    wal_storage: rocksdb
    rocksdb_shared_memory_budget_mb: 768
    rocksdb_shared_memtable_budget_mb: 256
  env:
    MALLOC_ARENA_MAX: "2"
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:reg10"
workload:
  kind: bank
  database: caraxes
  rows: 20000
  mode: closed
  workers: 128
  connections: 64
  duration: 6m
  warmup: 1m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
nemesis:
  seed: 1
  events:
    - { at: 3m, fault: kill, target: leader, duration: 30s }
checks:
  require_recovery: false
  require_progress_under_fault: false
teardown: true
