# Acceptance for the size-cap and export-memory fix, the run that failed before it (see tools/branch/size-repro.py). Image caraxes/camusdb:fixes is
# CamusDB with Kahuna.Core built from main plus the working tree, baked with the certificates for nodes + spares = 10. Another count would
# regenerate them and rebuild the tag from ~/camusdb without the fix.
name: branch-size-accept-rocksdb
cluster:
  name: branchsize
  nodes: 5
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: false
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 4096
  kahuna:
    storage: rocksdb
    wal_storage: rocksdb
    rocksdb_shared_memory_budget_mb: 768
    rocksdb_shared_memtable_budget_mb: 256
  env:
    MALLOC_ARENA_MAX: "2"
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:fixes"
workload:
  kind: bank
  database: caraxes
  rows: 900000
  mode: closed
  workers: 64
  connections: 32
  duration: 22m
  warmup: 1m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
nemesis:
  seed: 1
  events:
    - { at: 20m, fault: kill, target: leader, duration: 15s }
checks:
  require_recovery: false
  require_progress_under_fault: false
teardown: true
