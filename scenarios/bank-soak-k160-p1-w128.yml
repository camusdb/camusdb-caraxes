# KAHUNA 1.6.0 — health check at camusdb main HEAD (e1ce2fa4), NOT a throughput A/B.
#
# WHY NOT AN A/B. The 1.5.6/1.5.7/1.5.8 arms that preceded this one are no longer admissible as a
# performance comparison. Two of those arms ran byte-identical server binaries and differed by 1.36x
# (1,440.3 vs 1,061.3 ops/s), and across all six 45m p1/w128 arms wall-clock start time predicts
# throughput at Pearson -0.963 — better than any code variable in the experiment. Whatever drifts on
# this host is larger than the effects being measured, so no single-run ops/s number from this arm
# means anything and none is claimed here. See CamusDB feature 46b7fe8c (RETRACTED) and kahuna
# feature 91531e50 (UNCONFIRMED).
#
# WHAT THIS ARM IS FOR. Kahuna.Core moved 1.5.8 -> 1.6.0 in `ee287adb`, a minor bump. The question
# is whether the stack still behaves CORRECTLY under 45 minutes of contended load: does the bank
# invariant hold, does reconciliation close, and do the failure classes that appeared in the 1.5.7/
# 1.5.8 arms (CADB0509 TransactionFinalizeUnresolved in node logs: 0 at the baseline, then 1,982 /
# 2,158 / 2,822 / 3,173 across the later arms) persist, shrink, or change shape. Those are counts and
# invariants, not timings, so host drift does not confound them.
#
# CONFOUND, STATED. This is HEAD, not an isolated Kahuna swap: four camusdb commits ride along with
# the bump -- `54cb6e4a` schema freshness reconciliation and sweep, `a02cb817` a DML schema pipeline
# regression test, `c94a0f39` gRPC batch statement routing, `e1ce2fa4` the missing leader range-page
# replication delegate. If the failure classes move, this arm cannot say which change moved them.
# That is acceptable for a health check and disqualifying for an attribution.
#
# WHAT WOULD BE BAD NEWS. Any bank-invariant violation, a reconciliation that does not close, a node
# that dies or fails to rejoin, or a NEW error code that none of the earlier arms produced. Rising
# CADB0509 alone is a lead, not a verdict, until it is reproduced interleaved.
name: bank-soak-k160-p1-w128
cluster:
  name: banksoakk160p1w128
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 4096
  camusdb_repo: "~/camusdb"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 128
  connections: 64
  duration: 45m
  warmup: 2m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
