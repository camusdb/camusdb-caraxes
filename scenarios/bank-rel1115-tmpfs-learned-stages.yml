# RELEASED STACK 1.11.5 (2026-10-09): CamusDB HEAD 1cce5c63 pinned to the published Kahuna.Core 1.11.5 -> Kahuna.Shared 1.11.5 ->
# Kommander 1.10.4, all from nuget.org. Image caraxes/camusdb:bankrel1115. First soak since the sn4 pair of 2026-10-01 (Kahuna
# 1.10.7-snap.4 / Kommander 1.9.5, both shapes PASS). Everything in between is unsoaked: CamusDB gained NUMERIC, LEFT/RIGHT/CROSS
# JOIN, INSERT ... RETURNING, foreign keys, staged ADD COLUMN, DISTINCT spill, distributed query planning and seven Kahuna bumps;
# Kahuna 1.10.7 -> 1.11.5 (gate-at-detection published, fenced snapshot reads, forwarded sequence redirect, MustRetry on an
# unproven commit probe, range-map entries installed in log order, intent side captured before the row scan in a snapshot export);
# Kommander 1.9.5 -> 1.10.4 (system-configuration entries installed in log order, monotonic partition-id floor, reply-hold hook
# once per ticket, batched commit-marker header reads, custom RocksDB driver, promotion drain and leaving-node fixes).
# The question is regression, not a specific fix: does the released stack still pass the same body the sn4 pair passed?
# CONTROL ARM: 10-minute tmpfs run with KOMMANDER_ROUND_STAGES=1. Compare with rel1105-stages (control 9,460 ops/s) and the
# tmpfs figure of record 9,031 ops/s (1.10.2/1.9.1). Materialize-on-resolve inherits the default (on since 6a081848).
name: bank-rel1115-tmpfs-learned-stages
cluster:
  name: bankrel1115stages
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 9728
  data_tmpfs_mb: 6144
  gc_heap_hard_limit_mb: 2458
  kahuna:
    # ON, and stated rather than inherited: this is CamusDB's default as of `529f8611`.
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:bankrel1115"
  env:
    KOMMANDER_ROUND_STAGES: "1"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 128
  connections: 64
  duration: 10m
  warmup: 6m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
