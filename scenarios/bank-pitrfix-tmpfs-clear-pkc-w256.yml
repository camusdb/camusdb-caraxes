# PITR FLOOR FIX VERIFICATION (2026-10-21): the reg3 body with the PITR keys at their DEFAULTS (3600 / 1800) on a local Kahuna pack
# 1.13.4-pitr.1 (Kahuna commit after 22e3a838: the retention floor is asserted only when BackupDir is configured; this rig has no
# backup_dir). CamusDB HEAD 9fd98ec0 with CamusDB.Core.csproj pinned to the local pack (uncommitted). Expected: raft_wal_shard_live_sst_bytes
# flat at ~0.6 GB as in reg3, container memory as in pkc5, ops/s inside the noise band of 10,696-10,744. memory_limit_mb 8192 and the
# host memory guard stay as a safety net; if the WAL grows like reg2 the nodes die at the cap instead of the host.
name: bank-pitrfix-tmpfs-clear-pkc-w256
cluster:
  name: bankpitrfixclearpkcw256
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 8192
  data_tmpfs_mb: 6144
  gc_heap_hard_limit_mb: 2458
  tls: false
  kahuna:
    # ON, and stated rather than inherited: this is CamusDB's default as of `529f8611`.
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:bankpitrfix1"
  camusdb:
    # The default since edcb9fab, stated so the control and the probe read the same.
    point_read_row_id_cache_enabled: true
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 256
  connections: 64
  duration: 10m
  warmup: 6m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
