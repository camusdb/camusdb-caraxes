# Forwarded durable requests off the ordered lane under OPEN-LOOP overload and faults (Kahuna 45f12c3a).
#
# lane-fault-fanout-kr.yml is closed-loop: 32 workers cap the cluster at ~32 transactions in flight, so a
# slow receiver can never be offered more forwarded work than ~100 requests, and a pile-up cannot form.
# This arm offers load the cluster cannot absorb: an open loop at 4,000 ops/s (half of them fanout writes,
# each forwarding about three durable requests to the other partition leaders) with up to 4,096 operations
# in flight on the client. With the ordered lane gone, the receiving leader's write-aggregator admission is
# the only back-pressure on that forwarded work; the faults below slow a receiving leader further.
#
# Same CamusDB build as lane-fault-fanout-kr (5f711e9d, Kahuna.Core 1.17.3 = 5dca7b47, which carries
# cbb1fcbb). Run with --skip-build so the tag is not rebuilt from a moved ~/camusdb tree.
#
# Read: receiver GC heap and working set against the closed-loop arm's ~1 GB plateau, the aggregator's
# queued items and rejections by reason (queue_full is the admission bound), reaper expiries and
# Unavailable on the senders, and whether throughput returns after each fault.
name: lane-overload-fanout-kr
cluster:
  name: laneoverloadfanout
  nodes: 3
  partitions: 3
  replication_factor: 3
  key_range_sharding: true
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 6144
  kahuna:
    recent_heartbeat_ms: 25
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:lanefault-5f711e9d"
workload:
  kind: fanout
  database: caraxes
  rows: 12000
  tables: 3
  mode: open
  target_ops: 4000
  max_in_flight: 4096
  workers: 64
  connections: 16
  duration: 12m
  warmup: 1m
  drain: 30s
  read_percent: 50
  write_percent: 50
  routing_mode: off
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
nemesis:
  seed: 46
  events:
    - { at: 3m,  fault: slow-disk, target: leader, duration: 60s }
    - { at: 6m,  fault: slow,      target: leader, duration: 60s, delay_ms: 200 }
    - { at: 9m,  fault: pause,     target: leader, duration: 30s }
settle_seconds: 90
checks:
  require_client_headroom: true
  require_cluster_facts: true
teardown: true
