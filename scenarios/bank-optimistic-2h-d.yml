# Second two-hour optimistic-locking soak. Two changes from bank-optimistic-2h:
#  - concurrency up from 24 to 64 workers over 16 connections, to push the retry loop harder;
#  - nemesis cut to pause and slow every 5-8 minutes, so the error rate reflects contention
#    rather than node loss. Kills and partitions produced every 100% error window and all three
#    recovery-limit failures in the first run.
# Same cluster, same seed, same 2000 rows, so the retry numbers compare directly.
name: bank-optimistic-2h-d
cluster:
  name: bank-opt-2hd
  nodes: 3
  partitions: 3
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  # Bounds each node's Server GC (self-caps at 75% of the cgroup limit). Without this, three
  # nodes race to the Docker VM ceiling and one gets OOM-killed mid-soak (runs C and E); see
  # runs/probes/memory-gc-2026-08-22/.
  memory_limit_mb: 1536
  camusdb_repo: "/Volumes/Data HD/Repositories/camusdb"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 32
  connections: 16
  duration: 2h
  warmup: 2m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
nemesis:
  seed: 42
  random:
    faults: [pause, slow]
    min_interval: 300s
    max_interval: 480s
    duration: 15s
checks:
  max_recovery_seconds: 60
  require_recovery: false   # a fault landing in the final seconds cannot be observed recovering; max_recovery_seconds still grades every observed fault
  require_progress_under_fault: true
teardown: false
