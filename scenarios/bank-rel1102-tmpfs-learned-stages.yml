# RELEASED ROUND STACK (2026-09-28): CamusDB HEAD pinned to Kahuna.Core 1.10.2 (nuget.org; Kahuna 885e9571: cycle_stage stamps,
# precise-wake knob off, lock-free window, materialize-on-resolve flag off) -> Kommander 1.9.1 (nuget.org; the fc4dabe7 task 3 round
# fixes + ordered per-peer append stream + apply-drain gate). Image caraxes/camusdb:bankrel1102. Plan 84b26503 critical path (3):
# stages arm: KOMMANDER_ROUND_STAGES=1 (raft.round.stage_ms) beside Kahuna's kahuna.kv.write.cycle_stage — both histograms on one
# run, so the commit is accounted end to end: aggregator cycle (raft, completion, hold, wake_late, dispatch) and Raft round by stage.
# Read: tools/p3c/window-metrics.py stages <run> and delta <run> "kahuna_kv_write_cycle_stage" camusN. Closes Kahuna 25311bb9 task 5.
name: bank-rel1102-tmpfs-learned-stages
cluster:
  name: bankrel1102stages
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  memory_limit_mb: 9728
  data_tmpfs_mb: 6144
  gc_heap_hard_limit_mb: 2458
  kahuna:
    # ON, and stated rather than inherited: this is CamusDB's default as of `529f8611`.
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:bankrel1102"
  env:
    KOMMANDER_ROUND_STAGES: "1"
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 128
  connections: 64
  duration: 10m
  warmup: 6m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
