# GC and write-hold defaults (2026-11-20): three-node k117-sol-tmpfs-head body, 3-minute warm-up and 4-minute window, one change per arm.
# 3 node(s) on tmpfs, 8 workers, image t5 (CamusDB 97319e2d, Kahuna.Core 1.18.0), fixed GC (adaptation off, 48 MiB gen0 a heap), heap limit 2,458 MiB, hold 0 and linger 0.
# Run with --skip-build.
name: t5-n3-w8-h0l0
cluster:
  name: t5n3w8h0
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  key_range_sharding: false
  locking: optimistic
  isolation: serializable
  diagnostics: true
  memory_limit_mb: 8192
  data_tmpfs_mb: 6144
  gc_heap_hard_limit_mb: 2458
  tls: false
  kahuna:
    storage: solarium
    wal_storage: solarium
    durable_materialize_on_resolve: true
    rocksdb_shared_memory_budget_mb: 768
    rocksdb_shared_memtable_budget_mb: 256
    one_phase_apply_time_validation: true
    staged_base_fence_retention_ms: 600000
    key_value_write_post_completion_hold_ms: 0
    key_value_write_linger_ms: 0
  env:
    MALLOC_ARENA_MAX: "2"
    DOTNET_GCDynamicAdaptationMode: "0"
    DOTNET_GCgen0size: "3000000"
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:t5"
  camusdb:
    point_read_row_id_cache_enabled: true
    optimistic_intent_wait_ms: 100
    serializable_optimistic_point_locks: false
workload:
  kind: bank
  database: caraxes
  rows: 2000
  mode: closed
  workers: 8
  connections: 8
  duration: 4m
  warmup: 3m
  drain: 30s
  read_percent: 50
  write_percent: 50
  expect_faults: true
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
