# SPLIT COST (2026-10-27): the bank-split body (4 partitions, 4,000 rows, 32 workers, key-range, range_split_threshold 300 so the seeded
# rows cascade into several ranges) without the fault schedule and measured for 10 minutes on the kr256 image. Pair: kr256-nosplit-bank-kr
# (same shape, threshold 1,000,000 so the table stays one range) and kr256-nosplit-bank-hash (hash routing, the same shape). Read: ops/s,
# the one-phase gate outcomes (a row and its index on different partitions fall back to two-phase), forwarded one-phase bundles and their
# mean (Kahuna ba8ac16a would show here), server commit mean, the range count at the end.
name: kr256-split-bank-kr
cluster:
  name: kr256splitbankkr
  nodes: 3
  partitions: 4
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  key_range_sharding: true
  image: "caraxes/camusdb:kr256"
  locking: optimistic
  isolation: read_committed
  diagnostics: true
  kahuna:
    range_split_threshold: 300
    range_split_min_range_size: 100
    range_split_load_threshold: 100
    range_split_load_min_queue_depth: 8
    range_split_load_window_ms: 15000
    range_split_load_poll_interval_ms: 5000
    range_split_load_imbalance_max: 0.8
    # Longer than the minimum, so the split cascade from the seeded rows outlasts the seeding.
    range_split_settle_window_ms: 15000
    enable_load_reports: true
workload:
  kind: bank
  database: caraxes
  rows: 4000
  mode: closed
  workers: 32
  duration: 10m
  warmup: 2m
  connections: 16
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  read_percent: 50
  write_percent: 50
  expect_faults: true
  scan_probe_interval: 5s
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
