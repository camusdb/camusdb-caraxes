# Diagnostic for the pr1 read ceiling (2026-11-14, image k1171): the pr1 point-read body over 500,000 rows, so the seed is short and the row-id cache covers the table. Defaults: almost every read takes a key-value actor round trip. 36,365 reads/s, PASS.
name: pr1x-500k-perf
cluster:
  name: pr1xperf
  nodes: 3
  partitions: 1
  replication_factor: 3
  placement_rebalancer: true
  leader_balancer: true
  locking: optimistic
  isolation: serializable
  diagnostics: true
  memory_limit_mb: 4096
  kahuna:
    storage: solarium
    wal_storage: solarium
    one_phase_apply_time_validation: true
    durable_materialize_on_resolve: true
    rocksdb_shared_memory_budget_mb: 768
    rocksdb_shared_memtable_budget_mb: 256
  env:
    MALLOC_ARENA_MAX: "2"
    DOTNET_PerfMapEnabled: "1"
  camusdb_repo: "~/camusdb"
  image: "caraxes/camusdb:k1171"
  camusdb:
    point_read_row_id_cache_enabled: true
    optimistic_intent_wait_ms: 100
    serializable_optimistic_point_locks: false
workload:
  kind: accounts
  database: caraxes
  rows: 500000
  payload_bytes: 256
  batch: 1000
  mode: closed
  workers: 256
  connections: 64
  duration: 4m
  warmup: 2m
  drain: 30s
  read_percent: 100
  write_percent: 0
  expect_faults: false
  node_metrics: true
  metrics_interval: 5s
  cluster_facts: true
  routing_mode: learned
checks:
  require_client_headroom: true
  require_cluster_facts: true
  require_quiet_host: true
teardown: true
